name: Auto Generate README

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/generate-readme.yml'
      - 'index.html'
      - 'style.css'
      - 'package.json'
      - 'composer.json'
  workflow_dispatch:

concurrency:
  group: generate-readme
  cancel-in-progress: false

jobs:
  generate-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Analyze repository structure
        id: analyze
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export TZ="Asia/Jakarta"

          mkdir -p /tmp/subs
          : > /tmp/subs/list.txt
          rm -f /tmp/exts.txt

          # Nama repo & owner
          REPO_FULL="${{ github.repository }}"
          OWNER=$(echo "$REPO_FULL" | cut -d'/' -f1)
          REPO=$(echo "$REPO_FULL" | cut -d'/' -f2)
          echo "owner=$OWNER" >> $GITHUB_OUTPUT
          echo "repo=$REPO" >> $GITHUB_OUTPUT
          # Pages URL: user repo -> user.github.io, lainnya -> user.github.io/repo
          if [ "$REPO" = "$OWNER.github.io" ]; then
            echo "pages_url=https://${OWNER}.github.io/" >> $GITHUB_OUTPUT
          else
            echo "pages_url=https://${OWNER}.github.io/${REPO}/" >> $GITHUB_OUTPUT
          fi

          # Nama & tagline: deskripsi repo adalah sumber paling otoritatif,
          # <title> HTML hanya dipakai bila halaman HTML memang isi utama repo.
          REPO_DESC=""
          if [ -n "${GH_TOKEN:-}" ]; then
            REPO_DESC=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${OWNER}/${REPO}" | jq -r '.description // ""')
          fi
          [ "$REPO_DESC" = "null" ] && REPO_DESC=""
          # Deskripsi seperti "-", "--", ".", "n/a" bukan tagline; perlakukan
          # sebagai kosong agar tidak muncul sebagai <em>-</em> di header.
          REPO_DESC=$(printf '%s' "$REPO_DESC" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
          case "$REPO_DESC" in
            -|--|---|.|..|n/a|N/A|na|none|None|NULL|"") REPO_DESC="" ;;
          esac
          # Buang juga deskripsi yang hanya berisi tanda baca/tanda hubung
          if ! printf '%s' "$REPO_DESC" | grep -qE '[[:alnum:]]'; then REPO_DESC=""; fi

          TITLE=""
          H1=""
          if [ -f index.html ]; then
            TITLE=$(grep -oP '(?<=<title>).*?(?=</title>)' index.html | head -1 | sed 's/[[:space:]]*$//')
            H1=$(grep -oP '(?<=<h1>).*?(?=</h1>)' index.html | head -1 | sed 's/<[^>]*>//g' | sed 's/[[:space:]]*$//')
          fi

          # Judul: <title> -> nama repo. Nama paket composer tidak dipakai
          # karena pada skeleton isinya nama framework, bukan nama proyek.
          if [ -z "$TITLE" ]; then TITLE="$REPO"; fi
          # Buang suffix pemisah umum, mis. "VOLTRA. | Mobilitas Listrik Premium"
          TITLE=$(printf '%s' "$TITLE" | sed -E 's/[[:space:]]*[|·—-][[:space:]]+.*$//' | sed 's/[[:space:]]*$//')
          if [ -z "$TITLE" ]; then TITLE="$REPO"; fi

          # Tagline: deskripsi repo -> <h1> yang layak -> kosong (blok <p> dihilangkan)
          ROLE="$REPO_DESC"
          if [ -z "$ROLE" ] && [ -n "$H1" ]; then
            H1CLEAN=$(printf '%s' "$H1" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            # <h1> yang isinya cuma nama repo/judul tidak menambah nilai
            if [ -n "$H1CLEAN" ] && [ "$H1CLEAN" != "$TITLE" ] && [ "$H1CLEAN" != "$REPO" ] \
               && printf '%s' "$H1CLEAN" | grep -qE '[[:alnum:]]'; then
              ROLE="$H1CLEAN"
            fi
          fi
          # Batasi panjang agar tidak merusak kartu header
          ROLE=$(printf '%s' "$ROLE" | cut -c1-140)

          echo "site_title=$TITLE" >> $GITHUB_OUTPUT
          echo "site_role=$ROLE" >> $GITHUB_OUTPUT

          # Hitung jumlah file & bahasa utama
          # README.md dikecualikan: berkas ini keluaran generator sendiri,
          # kalau dihitung hasilnya berubah antara run pertama (README belum
          # ada) dan run berikutnya (README sudah ada) -> memicu commit palsu.
          FILE_COUNT=$(find . -type f \
            -not -path '*/.git/*' -not -path '*/node_modules/*' \
            -not -path '*/dist/*' -not -path '*/build/*' \
            -not -path './README.md' | wc -l)
          echo "file_count=$FILE_COUNT" >> $GITHUB_OUTPUT

          # Ekstensi yang ada di repo (menentukan tech stack)
          TECH=""
          find . -type f -not -path '*/.git/*' | sed 's/.*\.//' | sort -u > /tmp/exts.txt
          if grep -qiE '^html$' /tmp/exts.txt; then TECH="${TECH}HTML, "; fi
          if grep -qiE '^css$' /tmp/exts.txt; then TECH="${TECH}CSS, "; fi
          if grep -qiE '^scss$' /tmp/exts.txt; then TECH="${TECH}SCSS, "; fi
          if grep -qiE '^js$' /tmp/exts.txt; then TECH="${TECH}JavaScript, "; fi
          if grep -qiE '^php$' /tmp/exts.txt; then TECH="${TECH}PHP, "; fi
          if grep -qiE '^py$' /tmp/exts.txt; then TECH="${TECH}Python, "; fi
          if grep -qiE '^(jsx|tsx)$' /tmp/exts.txt; then TECH="${TECH}React, "; fi
          TECH="${TECH%, }"
          [ -z "$TECH" ] && TECH="Tidak terdeteksi"
          echo "tech_stack=$TECH" >> $GITHUB_OUTPUT

          # Jenis proyek, dipakai untuk menyusun kalimat deskripsi yang akurat
          KIND="generic"
          if [ -f composer.json ] || [ -f index.php ] || [ -d app/Controllers ]; then
            KIND="php"
          elif [ -f package.json ]; then
            KIND="node"
          elif [ -f requirements.txt ] || [ -f pyproject.toml ] || [ -f setup.py ]; then
            KIND="python"
          elif [ -f index.html ]; then
            KIND="static"
          fi
          echo "project_kind=$KIND" >> $GITHUB_OUTPUT
          if [ -f index.html ]; then echo "is_static=true" >> $GITHUB_OUTPUT; else echo "is_static=false" >> $GITHUB_OUTPUT; fi

          # Struktur direktori nyata (depth 2), tanpa folder build/vendor.
          # README.md juga dikecualikan (keluaran generator sendiri).
          find . -maxdepth 2 \
            \( -name .git -o -name node_modules -o -name dist -o -name build -o -name vendor \) -prune -o \
            -print | sed 's|^\./||' | grep -v '^\.$' | grep -v '^README\.md$' \
            | LC_ALL=C sort > /tmp/tree_lines.txt

          # Daftar sub-proyek (folder dengan index.html di dalamnya, bukan root)
          # Beserta deskripsi singkat (dari heading README atau <title> index.html)
          : > /tmp/subs_table.txt
          for d in */; do
            d="${d%/}"
            if [ -f "$d/index.html" ]; then
              echo "$d" >> /tmp/subs/list.txt
              DESC=""
              if [ -f "$d/README.md" ]; then
                DESC=$(grep -vE '^[[:space:]]*$' "$d/README.md" \
                  | sed 's/<[^>]*>//g; s/^[[:space:]]*//; s/[[:space:]]*$//' \
                  | grep -vE '^!\[|^\[!\[|badge|shields\.io|img\.shields|Live Demo|Demo Scr' \
                  | grep -E '^#|^[A-Za-z]' \
                  | head -1 \
                  | sed 's/^#* *//; s/[[:space:]]*$//')
              fi
              if [ -z "$DESC" ] && [ -f "$d/index.html" ]; then
                DESC=$(grep -oP '(?<=<title>).*?(?=</title>)' "$d/index.html" | head -1 | sed 's/[[:space:]]*$//')
              fi
              [ -z "$DESC" ] && DESC="$d"
              echo "${d}|${DESC}" >> /tmp/subs_table.txt
            fi
          done
          echo "sub_count=$(wc -l < /tmp/subs/list.txt 2>/dev/null || echo 0)" >> $GITHUB_OUTPUT

      - name: Generate README content
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ steps.analyze.outputs.owner }}
          REPO: ${{ steps.analyze.outputs.repo }}
          PAGES_URL: ${{ steps.analyze.outputs.pages_url }}
          SITE_TITLE: ${{ steps.analyze.outputs.site_title }}
          SITE_ROLE: ${{ steps.analyze.outputs.site_role }}
          TECH_STACK: ${{ steps.analyze.outputs.tech_stack }}
          FILE_COUNT: ${{ steps.analyze.outputs.file_count }}
          SUB_COUNT: ${{ steps.analyze.outputs.sub_count }}
          PROJECT_KIND: ${{ steps.analyze.outputs.project_kind }}
          IS_STATIC: ${{ steps.analyze.outputs.is_static }}
        run: |
          export TZ="Asia/Jakarta"

          # Catatan: README ini sengaja TIDAK memuat timestamp yang di-commit.
          # Badge "Updated" memakai badge dinamis dari shields.io yang membaca
          # commit terakhir saat di-render, sehingga README hanya berubah bila
          # isi repo memang berubah. Tanpa ini, setiap run akan menghasilkan
          # commit baru (dulu 5 workflow x 10 menit di banyak repo).
          PAGES_STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${OWNER}/${REPO}/pages")
          PAGES_ENABLED="false"
          [ "$PAGES_STATUS" = "200" ] && PAGES_ENABLED="true"

          case "$PROJECT_KIND" in
            php)    KIND_DESC="proyek PHP" ;;
            node)   KIND_DESC="proyek Node.js" ;;
            python) KIND_DESC="proyek Python" ;;
            static) KIND_DESC="situs statis" ;;
            *)      KIND_DESC="proyek perangkat lunak" ;;
          esac

          if [ "$TECH_STACK" = "Tidak terdeteksi" ]; then
            KIND_SENTENCE="Repository **\`${REPO}\`** adalah ${KIND_DESC}."
          else
            KIND_SENTENCE="Repository **\`${REPO}\`** adalah ${KIND_DESC} yang dibangun dengan ${TECH_STACK}."
          fi

          {
            echo '<!-- README ini dihasilkan otomatis oleh .github/workflows/generate-readme.yml -->'
            echo '<!-- Jangan edit manual: perubahan akan ditimpa pada run berikutnya. -->'
            echo ""
            echo "<h1 align=\"center\">${SITE_TITLE} 👋</h1>"
            echo ""
            if [ -n "$SITE_ROLE" ]; then
              echo "<p align=\"center\">"
              echo "  <em>${SITE_ROLE}</em>"
              echo "</p>"
              echo ""
            fi
            echo "<p align=\"center\">"
            echo "  <a href=\"https://github.com/${OWNER}/${REPO}\"><img alt=\"GitHub repo\" src=\"https://img.shields.io/badge/GitHub-${OWNER}/${REPO}-blue?logo=github\"></a>"
            if [ "$PAGES_ENABLED" = "true" ]; then
              echo "  <a href=\"${PAGES_URL}\"><img alt=\"Live Demo\" src=\"https://img.shields.io/badge/Live%20Demo-Online-success?logo=githubpages\"></a>"
            fi
            echo "  <img alt=\"Files\" src=\"https://img.shields.io/badge/Files-${FILE_COUNT}-informational\">"
            echo "  <img alt=\"Last commit\" src=\"https://img.shields.io/github/last-commit/${OWNER}/${REPO}\">"
            echo "</p>"
            echo ""
            echo "---"
            echo ""
            echo "## 📖 Tentang"
            echo ""
            echo "${KIND_SENTENCE}"

            if [ "$IS_STATIC" = "true" ] && [ "$PAGES_ENABLED" = "true" ]; then
              echo "Situs ini diterbitkan melalui **GitHub Pages** dan dapat diakses di [\`${PAGES_URL}\`](${PAGES_URL})."
            elif [ "$PAGES_ENABLED" = "true" ]; then
              echo "Demo berjalan tersedia melalui **GitHub Pages** di [\`${PAGES_URL}\`](${PAGES_URL})."
            else
              echo "GitHub Pages belum diaktifkan untuk repository ini."
            fi
            echo ""
            echo "## 🗂️ Struktur Proyek"
            echo ""
            echo '```'
            echo "${REPO}/"
            while IFS= read -r entry; do
              [ -z "$entry" ] && continue
              name="${entry##*/}"
              if [ -d "$entry" ]; then
                name="${name}/"
              fi
              depth=$(awk -F/ '{print NF-1}' <<< "$entry")
              indent=$(printf '%*s' $((depth * 2)) '')
              echo "${indent}${name}"
            done < /tmp/tree_lines.txt
            echo '```'
            echo ""

            if [ "${SUB_COUNT}" -gt 0 ]; then
              echo "## 🌐 Sub-Proyek / Demo"
              echo ""
              echo "Repository ini juga memuat sub-proyek (masing-masing punya \`index.html\` tersendiri):"
              echo ""
              echo "| Folder | Keterangan |"
              echo "|--------|-----------|"
              while IFS='|' read -r sub desc; do
                echo "| [\`${sub}\`](./${sub}) | ${desc} |"
              done < /tmp/subs_table.txt
              echo ""
            fi

            echo "## 🛠️ Teknologi"
            echo ""
            echo "Berdasarkan ekstensi berkas yang terdeteksi di repository:"
            echo ""
            IFS=', ' read -ra ARR <<< "${TECH_STACK}"
            for t in "${ARR[@]}"; do
              [ -n "$t" ] && echo "- \`$t\`"
            done
            echo ""
            echo "> Total **${FILE_COUNT} berkas** di repository (di luar \`.git\`, \`node_modules\`, \`dist\`, dan \`build\`)."
            echo ""
            echo "## 🚀 Menjalankan Secara Lokal"
            echo ""
            case "$PROJECT_KIND" in
              php)
                echo "Butuh PHP dan Composer:"
                echo ""
                echo '```bash'
                echo "composer install"
                echo "php spark serve"
                echo "# atau"
                echo "php -S localhost:8000 -t public"
                echo '```'
                ;;
              node)
                echo "Butuh Node.js:"
                echo ""
                echo '```bash'
                echo "npm install"
                echo "npm run dev"
                echo '```'
                ;;
              python)
                echo "Butuh Python 3:"
                echo ""
                echo '```bash'
                echo "python3 -m venv .venv && source .venv/bin/activate"
                echo "pip install -r requirements.txt"
                echo '```'
                ;;
              static)
                echo "Tanpa dependency apa pun. Buka \`index.html\` langsung di browser, atau jalankan server statis:"
                echo ""
                echo '```bash'
                echo "python3 -m http.server 8000"
                echo "# lalu buka http://localhost:8000"
                echo '```'
                ;;
              *)
                echo "Lihat berkas konfigurasi di repository ini untuk cara menjalankannya."
                ;;
            esac
            echo ""
            echo "## 📬 Kontak"
            echo ""
            echo "- GitHub: [${OWNER}](https://github.com/${OWNER})"
            echo ""
            echo "## 📄 Lisensi"
            echo ""
            echo "Proyek ini dilisensikan di bawah MIT License — lihat berkas [\`LICENSE\`](./LICENSE)."
            echo ""
            echo "---"
            echo ""
            echo "<sub>README ini di-generate otomatis oleh GitHub Actions \`.github/workflows/generate-readme.yml\`.</sub>"
          } > README.md

          echo "=== Pratinjau README ==="
          cat README.md

      - name: Configure Git
        run: |
          git config user.name "antono4"
          git config user.email "antonockr1@gmail.com"

      - name: Commit and push README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export TZ="Asia/Jakarta"

          git add README.md

          if git diff --staged --quiet; then
            echo "Tidak ada perubahan pada README."
            exit 0
          fi

          git commit -m "docs: auto-generate README at $(date +'%Y-%m-%d %H:%M:%S') WIB"

          # Rebase & push dengan retry, agar aman bila ada commit lain masuk bersamaan
          for attempt in 1 2 3; do
            if git pull --rebase origin ${{ github.ref_name }} && git push origin ${{ github.ref_name }}; then
              echo "README berhasil diperbarui!"
              exit 0
            fi
            echo "Push attempt ${attempt} gagal, mencoba lagi..."
            sleep 5
          done

          echo "::error::Gagal push README setelah 3 percobaan."
          exit 1

